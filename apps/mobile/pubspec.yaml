name: opentrip_mobile
description: >
  Open-source, free driving trip tracker for Android and iOS, with direct
  vehicle telemetry over BLE for supported bikes (starting with Kawasaki
  Rideology-equipped models). No subscription, no paywalled features.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  kawasaki_rideology_ble:
    path: ../../packages/kawasaki_rideology_ble
  # BLE transport for the vehicle-connector layer.
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # Auth + (future) sync backend. Supabase is open-source and self-hostable,
  # matching this project's "free and open" premise — see /docs/AUTH_SETUP.md
  # for what you need to configure before login actually works.
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  # Local-first trip/vehicle storage (works with zero backend configured).
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  # GPS trip recording.
  geolocator: ^13.0.1
  # Trip route map. Pure-Dart tile renderer (no native map SDK, no
  # Mapbox/Google billing) — see trips/trip_detail_screen.dart.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Profile / vehicle photos.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^13.3.0
  # Phone-based lean angle tracking (trip/lean_angle_tracker.dart) — the
  # accelerometer, not activity/location sensors, so no runtime permission.
  sensors_plus: ^6.1.1
  # Nocturne theme (see theme/app_theme.dart): Inter everywhere.
  google_fonts: ^8.2.1
  # Bundled only for its font assets (lib/fonts/Phosphor*.ttf) — its own
  # Dart icon-data classes don't compile against this Flutter SDK anymore
  # (they `extend IconData`, which is now a `final` class). See
  # theme/ph_icons.dart, which references the same glyphs by codepoint.
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
