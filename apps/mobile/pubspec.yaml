name: opentrip_mobile
description: >
  Open-source, free driving trip tracker for Android and iOS, with direct
  vehicle telemetry over BLE for supported bikes (starting with Kawasaki
  Rideology-equipped models). No subscription, no paywalled features.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  kawasaki_rideology_ble:
    path: ../../packages/kawasaki_rideology_ble
  # BLE transport for the vehicle-connector layer.
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # Auth + (future) sync backend. Supabase is open-source and self-hostable,
  # matching this project's "free and open" premise — see /docs/AUTH_SETUP.md
  # for what you need to configure before login actually works.
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  # Local-first trip/vehicle storage (works with zero backend configured).
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  # GPS trip recording.
  geolocator: ^13.0.1
  # Trip route map. Pure-Dart tile renderer (no native map SDK, no
  # Mapbox/Google billing) — see trips/trip_detail_screen.dart.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Profile / vehicle photos.
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  # Auto-start drive detection (autostart/) — activity_recognition detects
  # "you're now in a vehicle"; foreground_task keeps that detection alive
  # even after the app is swiped away, unlike the recording foreground
  # service in trip/location_recorder.dart (see that file's doc comment).
  flutter_activity_recognition: ^4.0.0
  flutter_foreground_task: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
