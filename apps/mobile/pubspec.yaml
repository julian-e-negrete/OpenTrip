name: opentrip_mobile
description: >
  Open-source, free driving trip tracker for Android and iOS, with direct
  vehicle telemetry over BLE for supported bikes (starting with Kawasaki
  Rideology-equipped models). No subscription, no paywalled features.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  kawasaki_rideology_ble:
    path: ../../packages/kawasaki_rideology_ble
  # BLE transport for the vehicle-connector layer.
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # Auth + (future) sync backend. Supabase is open-source and self-hostable,
  # matching this project's "free and open" premise — see /docs/AUTH_SETUP.md
  # for what you need to configure before login actually works.
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  # Local-first trip/vehicle storage (works with zero backend configured).
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  # GPS trip recording.
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
