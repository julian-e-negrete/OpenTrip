name: iOS TestFlight

# Builds, signs and uploads the iPhone app to TestFlight, so testers just
# tap an invite link — no Mac, no cable, no 7-day expiry. Needs a paid
# Apple Developer Program membership and four repo secrets (see
# docs/IOS_DISTRIBUTION.md for the one-time setup):
#
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   that key's issuer ID
#   APP_STORE_CONNECT_KEY_P8      the downloaded AuthKey_XXXX.p8 file's contents
#   APPLE_TEAM_ID                 your 10-character team ID
#
# Signing is Xcode's automatic, Apple-managed ("cloud") signing driven by
# that API key — no certificate or provisioning-profile files to export,
# store or renew. Until the secrets exist, the job exits early with a
# notice instead of failing, so this file is safe to have on main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Two uploads racing each other gain nothing; let one finish.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the signing secrets are set
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight upload skipped: App Store Connect secrets aren't set. See docs/IOS_DISTRIBUTION.md."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install app dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/mobile
        run: flutter pub get

      - name: Set the Google Sign-In URL scheme
        if: steps.secrets.outputs.ready == 'true'
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: .github/scripts/ios-set-google-url-scheme.sh

      - name: Install the App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          printf '%s\n' "$ASC_KEY_P8" > "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Prepares the Flutter side (Dart AOT build, dart-defines, build
      # number) so the xcodebuild archive below picks it all up. The build
      # number must grow with every upload — TestFlight rejects repeats —
      # so it's derived from the run, re-runs included.
      - name: Build the Flutter side
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          build_number=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "Build number: $build_number"
          flutter build ios --release --no-codesign --build-number="$build_number" \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}

      - name: Archive and sign
        if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Uploaded. It appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 minutes)."
